<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Gathering Of The Fallen</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html, body {
        background: #0a0a1e;
        margin: 0;
        padding: 0;
      }
      #root {
        min-height: 100vh;
      }
      [data-replit-badge],
      [data-replit-feedback],
      [data-replit-widget],
      [data-replit],
      .replit-badge,
      .replit-badge-v2,
      .replit-badge-v3,
      .replit-feedback,
      .replit-widget,
      #replit-badge,
      #replit-badge-iframe,
      #replit-feedback,
      #replit-feedback-widget,
      .replit-watermark,
      div[class*="replit-badge"],
      div[id*="replit-badge"],
      div[class*="replit-feedback"],
      div[id*="replit-feedback"],
      div[class*="replit-widget"],
      div[id*="replit-widget"],
      iframe[src*="replit.com/badge"],
      iframe[src*="replit.dev/badge"],
      iframe[src*="replit.com/feedback"],
      iframe[src*="replit.dev/feedback"],
      iframe[src*="replit.com/widget"],
      iframe[src*="replit.dev/widget"],
      iframe[src*="replit.com/inbox"],
      iframe[src*="replit.dev/inbox"],
      a[href*="replit.com/badge"],
      a[href*="replit.com?utm"],
      a[href*="replit.com/?utm"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var TEXT_PATTERNS = [
          'made on replit',
          'made with replit',
          'built on replit',
          'powered by replit',
          'share your feedback',
          'help improve this app',
          'sharing your feedback with the creator',
          'this app is built on replit'
        ];
        var ATTR_PATTERNS = [
          'replit-badge',
          'replit-feedback',
          'replit-widget',
          'replit-inbox',
          'replit.com/badge',
          'replit.com/feedback',
          'replit.com/widget',
          'replit.com/inbox',
          'replit.dev/badge',
          'replit.dev/feedback',
          'replit.dev/widget',
          'replit.dev/inbox'
        ];
        function looksLikeReplitWidget(el) {
          if (!el || el.nodeType !== 1) return false;
          if (el.id === 'root' || el.tagName === 'SCRIPT' || el.tagName === 'STYLE' || el.tagName === 'LINK' || el.tagName === 'META') return false;
          var html = (el.outerHTML || '').toLowerCase();
          for (var a = 0; a < ATTR_PATTERNS.length; a++) {
            if (html.indexOf(ATTR_PATTERNS[a]) !== -1) return true;
          }
          var text = (el.textContent || '').toLowerCase();
          if (text.length > 0 && text.length < 400) {
            for (var t = 0; t < TEXT_PATTERNS.length; t++) {
              if (text.indexOf(TEXT_PATTERNS[t]) !== -1) return true;
            }
          }
          return false;
        }
        function nuke() {
          var bodyKids = document.body ? document.body.children : [];
          for (var i = bodyKids.length - 1; i >= 0; i--) {
            var n = bodyKids[i];
            if (n.id === 'root' || n.tagName === 'SCRIPT') continue;
            if (looksLikeReplitWidget(n)) {
              n.remove();
              continue;
            }
            var inner = n.querySelectorAll ? n.querySelectorAll('*') : [];
            for (var k = 0; k < inner.length; k++) {
              if (looksLikeReplitWidget(inner[k])) {
                try { inner[k].remove(); } catch (e) {}
              }
            }
          }
          var iframes = document.querySelectorAll('iframe');
          for (var j = 0; j < iframes.length; j++) {
            var src = (iframes[j].getAttribute('src') || '').toLowerCase();
            for (var p = 0; p < ATTR_PATTERNS.length; p++) {
              if (src.indexOf(ATTR_PATTERNS[p]) !== -1) {
                iframes[j].remove();
                break;
              }
            }
          }
        }
        function safeNuke() { try { nuke(); } catch (e) {} }
        safeNuke();
        if (window.MutationObserver) {
          var obs = new MutationObserver(safeNuke);
          if (document.documentElement) {
            obs.observe(document.documentElement, { childList: true, subtree: true });
          }
        }
        document.addEventListener('DOMContentLoaded', safeNuke);
        window.addEventListener('load', safeNuke);
        setInterval(safeNuke, 1500);
      })();
    </script>
  </body>
</html>
