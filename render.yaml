databases:
  - name: gathering-of-the-fallen-db
    plan: free

services:
  - type: web
    name: gathering-of-the-fallen
    runtime: node
    plan: free
    buildCommand: |
      pnpm install --frozen-lockfile
      pnpm --filter @workspace/web run build
      pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gathering-of-the-fallen-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AI_INTEGRATIONS_OPENAI_BASE_URL
        sync: false
      - key: AI_INTEGRATIONS_OPENAI_API_KEY
        sync: false
      # GOTF LIVE AI sales + license server (see DEPLOY.md)
      - key: LICENSE_SIGNING_KEY
        sync: false
      - key: LICENSE_IP_SALT
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: GOTF_PRICE_ID
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: GOTF_SETUP_OBJECT_KEY
        value: GOTF-LIVE-AI-Setup.exe
      - key: GOTF_DOWNLOAD_URL
        sync: false
      - key: ORACLE_FALLBACK_URL
        value: https://gathering-of-the-fallen.replit.app/api/oracle/chat
