databases:
  - name: gathering-of-the-fallen-db
    plan: free

services:
  - type: web
    name: gathering-of-the-fallen
    runtime: node
    plan: free
    buildCommand: |
      pnpm install --frozen-lockfile
      pnpm --filter @workspace/web run build
      pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gathering-of-the-fallen-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AI_INTEGRATIONS_OPENAI_BASE_URL
        sync: false
      - key: AI_INTEGRATIONS_OPENAI_API_KEY
        sync: false
      - key: ORACLE_FALLBACK_URL
        value: https://gathering-of-the-fallen.replit.app/api/oracle/chat
